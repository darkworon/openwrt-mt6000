name: Build DAE package for GL-MT6000

on:
  workflow_dispatch:
    inputs:
      dae_source_ref:
        description: "dae branch/tag/ref to resolve when dae_source_version is latest"
        default: "main"
        required: true
      dae_source_version:
        description: "dae commit hash, or latest to resolve dae_source_ref"
        default: "latest"
        required: true
      dae_outbound_ref:
        description: "outbound branch/tag/ref with salamander support"
        default: "stickyip-salamander"
        required: true
      openwrt_ref:
        description: "openwrt/openwrt branch/tag/ref"
        default: "main"
        required: true

permissions:
  contents: read

jobs:
  build-dae-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      OPENWRT_REF: ${{ inputs.openwrt_ref || 'main' }}
      DAE_SOURCE_REF: ${{ inputs.dae_source_ref || 'main' }}
      DAE_SOURCE_VERSION: ${{ inputs.dae_source_version || 'latest' }}
      DAE_OUTBOUND_REF: ${{ inputs.dae_outbound_ref || 'stickyip-salamander' }}
      DAE_PKG_VERSION: 2.0.0_alpha_git
      DAE_SOURCE_URL: https://github.com/daeuniverse/dae.git
      DAE_SOURCE_DATE: git
      DAE_OUTBOUND_REPO: https://github.com/darkworon/outbound.git
      DAE_MIRROR_HASH: skip
      WORKDIR: ${{ github.workspace }}/.work
      CCACHE_DIR: ${{ github.workspace }}/.work/ccache

    steps:
      - name: Checkout MT6000 overlay
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get autoremove -y
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl libelf-dev dwarves ca-certificates \
            ccache xz-utils

      - name: Cache OpenWrt build helpers
        uses: actions/cache@v4
        with:
          path: |
            .work/ccache
            .work/openwrt/staging_dir/host
            .work/openwrt/staging_dir/hostpkg
          key: dae-package-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            dae-package-${{ runner.os }}-

      - name: Build dae package
        run: ci/build-openwrt.sh package

      - name: Upload dae package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dae-package-mt6000
          if-no-files-found: error
          path: |
            .work/openwrt/bin/packages/**/*.apk
            .work/openwrt/bin/packages/**/*.ipk
            .work/openwrt/bin/targets/mediatek/filogic/packages/**/*.apk
            .work/openwrt/bin/targets/mediatek/filogic/packages/**/*.ipk
            .work/openwrt/bin/targets/mediatek/filogic/packages/Packages*
