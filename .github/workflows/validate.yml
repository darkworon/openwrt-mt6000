name: Validate patches

on:
  workflow_dispatch:

concurrency:
  group: mt6000-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: mt6000-overlay

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl libelf-dev dwarves ccache

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-mt6000-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-mt6000-v2-${{ runner.os }}-
            ccache-mt6000-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE/openwrt" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          CCACHE_DIR="$HOME/.ccache" ccache -M 5G
          CCACHE_DIR="$HOME/.ccache" ccache -z || true

      - name: Clone OpenWrt
        run: |
          rm -rf openwrt
          git clone --depth=1 --branch main https://github.com/openwrt/openwrt.git openwrt
          echo "OpenWrt SHA: $(git -C openwrt rev-parse --short HEAD)"

      - name: Restore OpenWrt downloads
        id: cache-openwrt-dl
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-v2-${{ runner.os }}-${{ hashFiles('mt6000-overlay/config/feeds.conf.default') }}
          restore-keys: |
            openwrt-dl-v2-${{ runner.os }}-
            openwrt-dl-v1-

      - name: Restore OpenWrt feeds
        id: cache-openwrt-feeds
        uses: actions/cache/restore@v4
        with:
          path: openwrt/feeds
          key: openwrt-feeds-v1-${{ runner.os }}-${{ hashFiles('mt6000-overlay/config/feeds.conf.default') }}
          restore-keys: |
            openwrt-feeds-v1-${{ runner.os }}-

      - name: Restore toolchain
        id: cache-openwrt-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-aarch64_cortex-a53_musl
          key: openwrt-toolchain-v3-${{ hashFiles('openwrt/tools/**', 'openwrt/toolchain/**') }}
          restore-keys: |
            openwrt-toolchain-v3-
            openwrt-toolchain-v2-
            openwrt-toolchain-
            validate-toolchain-
            tools-openwrt-

      - name: Report restored cache state
        run: |
          echo "ccache exact hit: ${{ steps.cache-ccache.outputs.cache-hit }}"
          echo "OpenWrt dl exact hit: ${{ steps.cache-openwrt-dl.outputs.cache-hit }}"
          echo "OpenWrt feeds exact hit: ${{ steps.cache-openwrt-feeds.outputs.cache-hit }}"
          echo "OpenWrt toolchain exact hit: ${{ steps.cache-openwrt-toolchain.outputs.cache-hit }}"
          du -sh openwrt/dl openwrt/feeds openwrt/staging_dir/host openwrt/staging_dir/hostpkg openwrt/staging_dir/toolchain-* 2>/dev/null || true

      - name: Apply mt76 overlay (Makefile pin)
        run: |
          mkdir -p openwrt/package/kernel/mt76
          if [ -f mt6000-overlay/files/package/kernel/mt76/Makefile ]; then
            cp mt6000-overlay/files/package/kernel/mt76/Makefile openwrt/package/kernel/mt76/Makefile
            echo "mt76 Makefile overridden: $(grep PKG_SOURCE_DATE openwrt/package/kernel/mt76/Makefile)"
          fi

      - name: Apply kernel patches
        run: |
          PATCHES_DIR="mt6000-overlay/patches/kernel"
          TARGET_DIR="$(ls -d openwrt/target/linux/mediatek/patches-* 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$TARGET_DIR" ]; then
            echo "No mediatek kernel patches directory found"
            exit 1
          fi
          cp -v "$PATCHES_DIR"/*.patch "$TARGET_DIR/" 2>/dev/null || true
          echo "kernel patches: $(ls $PATCHES_DIR/*.patch 2>/dev/null | wc -l)"

      - name: Apply DAE kernel config
        run: |
          KERNEL_CONFIG="$(ls openwrt/target/linux/mediatek/filogic/config-* 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$KERNEL_CONFIG" ]; then
            echo "No mediatek/filogic kernel config found"
            exit 1
          fi

          openwrt/scripts/kconfig.pl + "$KERNEL_CONFIG" mt6000-overlay/config/dae-kernel.config \
            > "$KERNEL_CONFIG.new"
          mv "$KERNEL_CONFIG.new" "$KERNEL_CONFIG"

      - name: Apply mt76 patches
        run: |
          TARGET_DIR="openwrt/package/kernel/mt76/patches"
          mkdir -p "$TARGET_DIR"
          for PATCHES_DIR in mt6000-overlay/patches/mt76 mt6000-overlay/patches/mt76-local; do
            [ -d "$PATCHES_DIR" ] || continue
            cp -v "$PATCHES_DIR"/*.patch "$TARGET_DIR/" 2>/dev/null || true
          done
          echo "mt76 patches: $(ls $TARGET_DIR/*.patch 2>/dev/null | wc -l)"

      - name: Copy diffconfig
        run: |
          cp mt6000-overlay/config/mt6000.diffconfig openwrt/.config
          echo "CONFIG_DEVEL=y" >> openwrt/.config
          echo "CONFIG_CCACHE=y" >> openwrt/.config
          mkdir -p openwrt/staging_dir/host/etc
          {
            echo "compiler_type=gcc"
            echo "compiler_check=content"
            echo "base_dir=$GITHUB_WORKSPACE/openwrt"
          } > openwrt/staging_dir/host/etc/ccache.conf
          cp mt6000-overlay/config/feeds.conf.default openwrt/feeds.conf.default

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a -q
          ./scripts/feeds install -a -q

      - name: Build toolchain (cached)
        run: |
          cd openwrt
          make defconfig
          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 tools/install toolchain/install
          echo "=== cache/build dir sizes after toolchain ==="
          du -sh staging_dir/host staging_dir/hostpkg staging_dir/toolchain-* 2>/dev/null || true
          ccache -s || true

      - name: Compile kernel
        run: |
          cd openwrt
          set +e
          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 target/compile > /tmp/target-compile.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== target/compile failed: last 120 lines ==="
            tail -120 /tmp/target-compile.log
            echo "=== target/compile filtered errors ==="
            grep -E "error:|warning: .*error|Hunk|reject|FAILED|failed to build|ERROR:" /tmp/target-compile.log | \
              grep -v "^#\|//\| \* " | tail -120 || true
            echo "=== target/linux verbose rebuild for diagnostics ==="
            make -j1 V=s CCACHE_DIR=~/.ccache USE_CCACHE=1 target/linux/clean > /tmp/target-linux-clean.log 2>&1
            make -j1 V=s CCACHE_DIR=~/.ccache USE_CCACHE=1 target/linux/compile 2>&1 | tee /tmp/target-linux-debug.log
            linux_status=${PIPESTATUS[0]}
            echo "=== target/linux filtered errors ==="
            grep -E "error:|warning: .*error|Hunk|reject|FAILED|failed to build|ERROR:" /tmp/target-linux-debug.log | \
              grep -v "^#\|//\| \* " | tail -120 || true
            echo "=== target/linux verbose result: $linux_status ==="
          else
            tail -20 /tmp/target-compile.log
          fi
          exit "$status"

      - name: Compile mt76 (validation target)
        run: |
          set +e
          cd openwrt
          echo "=== Compiling mt76 ==="
          make -j$(nproc) V=s CCACHE_DIR=~/.ccache USE_CCACHE=1 package/kernel/mt76/compile 2>&1 | tee /tmp/mt76-compile.log
          status=${PIPESTATUS[0]}
          grep -E "error:|warning: .*error|Hunk|reject|FAILED|failed to build" /tmp/mt76-compile.log | \
            grep -v "^#\|//\| \* " | tail -80 || true
          echo "=== mt76 compile result: $status ==="
          ccache -s || true
          exit $status

      - name: Save ccache
        if: always() && steps.cache-ccache.outputs.cache-primary-key != '' && steps.cache-ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}

      - name: Save OpenWrt downloads
        if: always() && steps.cache-openwrt-dl.outputs.cache-primary-key != '' && steps.cache-openwrt-dl.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: ${{ steps.cache-openwrt-dl.outputs.cache-primary-key }}

      - name: Save OpenWrt feeds
        if: always() && steps.cache-openwrt-feeds.outputs.cache-primary-key != '' && steps.cache-openwrt-feeds.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: openwrt/feeds
          key: ${{ steps.cache-openwrt-feeds.outputs.cache-primary-key }}

      - name: Save toolchain
        if: always() && steps.cache-openwrt-toolchain.outputs.cache-primary-key != '' && steps.cache-openwrt-toolchain.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-aarch64_cortex-a53_musl
          key: ${{ steps.cache-openwrt-toolchain.outputs.cache-primary-key }}

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id=84668999 \
            -d text="❌ Patch validation FAILED | ${{ github.sha }} | Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
