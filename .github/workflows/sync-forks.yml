name: Sync forks with pesa1234 upstream

on:
  schedule:
    - cron: '0 3 * * 5'  # каждую пятницу в 03:00 UTC (перед сборкой в 05:00)
  workflow_dispatch:

concurrency:
  group: mt6000-sync-forks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        repo:
          - { fork: 'darkworon/openwrt', upstream: 'pesa1234/openwrt', branch: 'next-r4.8.2.rss.mtk' }
          - { fork: 'darkworon/mt76', upstream: 'pesa1234/mt76', branch: 'main' }
          - { fork: 'darkworon/openwrt-mt6000-packages', upstream: 'pesa1234/packages', branch: 'next-r4.mtk' }
          - { fork: 'darkworon/openwrt-mt6000-luci', upstream: 'pesa1234/luci', branch: 'next-v4' }

    steps:
      - name: Sync ${{ matrix.repo.fork }} ← ${{ matrix.repo.upstream }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FORK="${{ matrix.repo.fork }}"
          BRANCH="${{ matrix.repo.branch }}"

          RESULT=$(curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$FORK/merge-upstream" \
            -d "{\"branch\":\"$BRANCH\"}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('merge_type', d.get('message','?')))")

          echo "$FORK branch $BRANCH: $RESULT"
