name: Build OpenWrt for GL-MT6000

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload as GitHub Release'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get autoremove -y
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl libelf-dev dwarves

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-mt6000-${{ github.sha }}
          restore-keys: |
            ccache-mt6000-

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
          key: tools-mt6000-${{ hashFiles('openwrt/tools/**') }}
          restore-keys: |
            tools-mt6000-

      - name: Clone pesa1234 OpenWrt (pinned SHA)
        run: |
          # Форк pesa1234/openwrt, ветка next-r4.8.0.rss.mtk
          # SHA фиксируется для воспроизводимости
          git clone --depth=1 --branch next-r4.8.0.rss.mtk \
            https://github.com/pesa1234/openwrt.git openwrt
          cd openwrt
          echo "Upstream SHA: $(git rev-parse HEAD)"

      - name: Update feeds (pesa1234 forks)
        run: |
          cd openwrt
          # Использовать feeds от pesa1234 для LuCI ATF/WED/RPS управления
          cat > feeds.conf << 'EOF'
          src-git packages https://github.com/pesa1234/packages.git;next-r4.mtk
          src-git luci https://github.com/pesa1234/luci.git;next-v4
          src-git routing https://git.openwrt.org/feed/routing.git
          src-git telephony https://git.openwrt.org/feed/telephony.git
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy diffconfig
        run: |
          cp mt6000.diffconfig openwrt/.config

      - name: Expand config
        run: |
          cd openwrt
          make defconfig

      - name: Verify DAE kernel config
        run: |
          cd openwrt
          echo "=== DAE kernel params check ==="
          for param in CONFIG_CGROUPS CONFIG_KPROBES CONFIG_DEBUG_INFO_BTF \
                       CONFIG_BPF_STREAM_PARSER CONFIG_NET_SCH_INGRESS \
                       CONFIG_NET_CLS_BPF CONFIG_NET_CLS_ACT CONFIG_BPF_EVENTS; do
            val=$(grep "^$param" .config || echo "NOT SET")
            echo "$param = $val"
          done

      - name: Build tools & toolchain
        run: |
          cd openwrt
          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 \
            tools/install toolchain/install V=s 2>&1 | \
            grep -E "^(make|ERROR|WARNING)" || true

      - name: Build target
        run: |
          cd openwrt
          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 \
            target/compile V=s 2>&1 | \
            grep -E "^(make|ERROR|WARNING)" || true

      - name: Build packages
        run: |
          cd openwrt
          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 \
            package/compile package/index V=s 2>&1 | \
            grep -E "^(make|ERROR|WARNING)" || true

      - name: Build firmware image
        run: |
          cd openwrt
          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 \
            target/install V=s 2>&1 | \
            grep -E "^(make|ERROR|WARNING)" || true

      - name: Collect artifacts
        run: |
          mkdir -p output
          find openwrt/bin/targets -name "*.bin" -o -name "*.img" | \
            xargs -I{} cp {} output/ 2>/dev/null || true
          ls -la output/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-mt6000-${{ github.sha }}
          path: output/
          if-no-files-found: warn
          retention-days: 30

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true
