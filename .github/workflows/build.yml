name: Build OpenWrt for GL-MT6000

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'config/**'
      - 'files/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '0 5 * * 5'  # пятница 05:00 UTC (после track вс+ср)
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "openwrt/openwrt branch/tag/ref"
        default: "main"
        required: true
      dae_source_ref:
        description: "dae branch/tag/ref to resolve when dae_source_version is latest"
        default: "main"
        required: true
      dae_source_version:
        description: "dae commit hash, or latest to resolve dae_source_ref"
        default: "latest"
        required: true
      dae_outbound_ref:
        description: "outbound branch/tag/ref with salamander support"
        default: "stickyip-salamander"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      OPENWRT_REF: ${{ github.event.inputs.openwrt_ref || 'main' }}
      DAE_SOURCE_REF: ${{ github.event.inputs.dae_source_ref || 'main' }}
      DAE_SOURCE_VERSION: ${{ github.event.inputs.dae_source_version || 'latest' }}
      DAE_OUTBOUND_REF: ${{ github.event.inputs.dae_outbound_ref || 'stickyip-salamander' }}

    steps:
      - name: Checkout this repo (patches + config)
        uses: actions/checkout@v4
        with:
          path: mt6000-overlay

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get autoremove -y
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl libelf-dev dwarves

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-mt6000-${{ github.sha }}
          restore-keys: |
            ccache-mt6000-

      - name: Clone official OpenWrt (upstream)
        run: |
          rm -rf openwrt
          git clone --depth=1 --branch "${OPENWRT_REF:-main}" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "OpenWrt upstream SHA: $(git rev-parse HEAD)"

      - name: Cache OpenWrt tools/toolchain
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-aarch64_cortex-a53_musl
          key: openwrt-toolchain-${{ hashFiles('openwrt/tools/**', 'openwrt/toolchain/**', 'mt6000-overlay/config/mt6000.diffconfig') }}
          restore-keys: |
            openwrt-toolchain-

      - name: Apply kernel patches (pesa1234 series)
        run: |
          PATCHES_DIR="mt6000-overlay/patches/kernel"
          TARGET_DIR="$(ls -d openwrt/target/linux/mediatek/patches-* 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$TARGET_DIR" ]; then
            echo "No mediatek kernel patches directory found"
            exit 1
          fi
          if [ -d "$PATCHES_DIR" ] && [ "$(ls -A $PATCHES_DIR)" ]; then
            echo "Applying kernel patches to $TARGET_DIR..."
            cp -v "$PATCHES_DIR"/*.patch "$TARGET_DIR/" 2>/dev/null || true
            echo "Kernel patches applied: $(ls $PATCHES_DIR/*.patch 2>/dev/null | wc -l)"
          else
            echo "No kernel patches found in $PATCHES_DIR — skipping"
          fi

      - name: Apply mt76 patches
        run: |
          TARGET_DIR="openwrt/package/kernel/mt76/patches"
          mkdir -p "$TARGET_DIR"
          for PATCHES_DIR in mt6000-overlay/patches/mt76 mt6000-overlay/patches/mt76-local; do
            [ -d "$PATCHES_DIR" ] || continue
            cp -v "$PATCHES_DIR"/*.patch "$TARGET_DIR/" 2>/dev/null || true
          done
          echo "mt76 patches applied: $(ls $TARGET_DIR/*.patch 2>/dev/null | wc -l)"

      - name: Apply overlay files (advanced_setup etc.)
        run: |
          OVERLAY_DIR="mt6000-overlay/files"
          if [ -d "$OVERLAY_DIR" ] && [ "$(ls -A $OVERLAY_DIR)" ]; then
            echo "Applying overlay files..."
            cp -rv "$OVERLAY_DIR"/. openwrt/
          else
            echo "No overlay files — skipping"
          fi

      - name: Apply DAE kernel config
        run: |
          KERNEL_CONFIG="$(ls openwrt/target/linux/mediatek/filogic/config-* 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$KERNEL_CONFIG" ]; then
            echo "No mediatek/filogic kernel config found"
            exit 1
          fi

          echo "Applying mt6000-overlay/config/dae-kernel.config to $KERNEL_CONFIG"
          openwrt/scripts/kconfig.pl + "$KERNEL_CONFIG" mt6000-overlay/config/dae-kernel.config \
            > "$KERNEL_CONFIG.new"
          mv "$KERNEL_CONFIG.new" "$KERNEL_CONFIG"

          echo "=== DAE target kernel config ==="
          grep -E '^(# )?CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|CGROUPS|KPROBES|NET_INGRESS|NET_EGRESS|NET_SCH_INGRESS|NET_CLS_BPF|NET_CLS_ACT|BPF_STREAM_PARSER|DEBUG_INFO|DEBUG_INFO_REDUCED|DEBUG_INFO_BTF|KPROBE_EVENTS|BPF_EVENTS|NETKIT)' \
            "$KERNEL_CONFIG" || true

      - name: Verify proxy policy overlay
        run: |
          grep -q "set network.globals.packet_steering='1'" \
            mt6000-overlay/files/target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-proxy-policy-base
          grep -q "net.core.default_qdisc = fq" \
            mt6000-overlay/files/target/linux/mediatek/filogic/base-files/etc/sysctl.d/99-vpn-tune.conf

      - name: Resolve latest dae source
        run: |
          DAE_SOURCE_URL="${DAE_SOURCE_URL:-https://github.com/daeuniverse/dae.git}"
          DAE_SOURCE_REF="${DAE_SOURCE_REF:-main}"
          DAE_SOURCE_VERSION="$(git ls-remote "$DAE_SOURCE_URL" "refs/heads/$DAE_SOURCE_REF" | awk '{print $1}')"
          if [ -z "$DAE_SOURCE_VERSION" ]; then
            DAE_SOURCE_VERSION="$(git ls-remote "$DAE_SOURCE_URL" "$DAE_SOURCE_REF" | awk 'NR == 1 {print $1}')"
          fi
          if [ -z "$DAE_SOURCE_VERSION" ]; then
            echo "Cannot resolve DAE_SOURCE_REF=$DAE_SOURCE_REF from $DAE_SOURCE_URL"
            exit 1
          fi

          {
            echo "DAE_PKG_VERSION=${DAE_PKG_VERSION:-2.0.0_alpha_git}"
            echo "DAE_SOURCE_URL=$DAE_SOURCE_URL"
            echo "DAE_SOURCE_REF=$DAE_SOURCE_REF"
            echo "DAE_SOURCE_VERSION=$DAE_SOURCE_VERSION"
            echo "DAE_SOURCE_DATE=${DAE_SOURCE_DATE:-git}"
            echo "DAE_OUTBOUND_REPO=${DAE_OUTBOUND_REPO:-https://github.com/darkworon/outbound.git}"
            echo "DAE_OUTBOUND_REF=${DAE_OUTBOUND_REF:-stickyip-salamander}"
            echo "DAE_MIRROR_HASH=${DAE_MIRROR_HASH:-skip}"
          } >> "$GITHUB_ENV"

          echo "dae source: $DAE_SOURCE_URL $DAE_SOURCE_REF -> $DAE_SOURCE_VERSION"

      - name: Copy feeds
        run: |
          cp mt6000-overlay/config/feeds.conf.default openwrt/feeds.conf.default

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Pin Go toolchain patchlevel
        run: |
          cd openwrt
          GO_MAKEFILE="feeds/packages/lang/golang/golang1.26/Makefile"
          test -f "$GO_MAKEFILE"
          sed -i \
            -e 's/^GO_VERSION_PATCH:=.*/GO_VERSION_PATCH:=2/' \
            -e 's/^PKG_HASH:=.*/PKG_HASH:=2e91ebb6947a96e9436fb2b3926a8802efe63a6d375dffec4f82aa9dbd6fd43b/' \
            "$GO_MAKEFILE"
          grep -q '^GO_DEFAULT_VERSION:=1.26$' feeds/packages/lang/golang/golang-values.mk
          grep -q '^GO_VERSION_PATCH:=2$' "$GO_MAKEFILE"
          grep -q '^PKG_HASH:=2e91ebb6947a96e9436fb2b3926a8802efe63a6d375dffec4f82aa9dbd6fd43b$' "$GO_MAKEFILE"
          echo "Pinned OpenWrt golang feed to Go 1.26.2"

      - name: Add dae packages (from openwrt-dae)
        run: |
          git clone --depth=1 https://github.com/darkworon/openwrt-dae.git /tmp/openwrt-dae
          /tmp/openwrt-dae/scripts/install-package.sh openwrt
          echo "dae package installed from openwrt-dae"
          ls openwrt/package/custom/dae/

      - name: Fix dae BPF toolchain selection
        run: |
          cd openwrt
          python3 <<'PY'
          from pathlib import Path
          import re

          makefile = Path("package/custom/dae/Makefile")
          text = makefile.read_text()
          if "$(BPF_DEPENDS)" not in text:
              raise SystemExit("expected $(BPF_DEPENDS) not found in dae Makefile")
          text = text.replace("$(BPF_DEPENDS)", "", 1)

          config_block = (
              "define Package/dae/config\n"
              "  config DAE_NEED_BPF_TOOLCHAIN\n"
              "    bool\n"
              "    depends on PACKAGE_dae\n"
              "    select NEED_BPF_TOOLCHAIN\n"
              "    default y\n"
              "endef\n\n"
          )
          if "select NEED_BPF_TOOLCHAIN" not in text:
              text = re.sub(
                  r"\n(?=define Package/dae-geoip\n)",
                  "\n" + config_block,
                  text,
                  count=1,
              )
          if "select NEED_BPF_TOOLCHAIN" not in text:
              raise SystemExit("failed to insert dae BPF toolchain config")
          makefile.write_text(text)
          PY
          ! grep -q '$(BPF_DEPENDS)' package/custom/dae/Makefile
          grep -q 'select NEED_BPF_TOOLCHAIN' package/custom/dae/Makefile

      - name: Verify dae Hysteria2 outbound
        run: |
          set -e
          grep -q 'go mod edit -replace=github.com/daeuniverse/outbound' \
            openwrt/package/custom/dae/Makefile

          rm -rf /tmp/dae-outbound-check
          git clone "$DAE_OUTBOUND_REPO" /tmp/dae-outbound-check
          git -C /tmp/dae-outbound-check checkout "$DAE_OUTBOUND_REF"

          grep -q 'FromLinkRegister("hysteria2"' \
            /tmp/dae-outbound-check/dialer/hysteria2/hysteria2.go
          grep -q 'FromLinkRegister("hy2"' \
            /tmp/dae-outbound-check/dialer/hysteria2/hysteria2.go
          grep -q 'case "salamander"' \
            /tmp/dae-outbound-check/protocol/hysteria2/client/client.go
          test -f /tmp/dae-outbound-check/protocol/hysteria2/client/salamander.go

      - name: Copy diffconfig
        run: |
          cp mt6000-overlay/config/mt6000.diffconfig openwrt/.config
          echo "=== Requested package config ==="
          grep -E '^CONFIG_PACKAGE_(dae|adguardhome|zerotier|kmod-sched|kmod-sched-core|kmod-sched-bpf|kmod-tcp-bbr)=' \
            openwrt/.config

      - name: Expand config
        run: |
          cd openwrt
          make defconfig

      - name: Verify critical packages
        run: |
          cd openwrt
          echo "=== Critical package check ==="
          missing=0
          for symbol in \
            CONFIG_PACKAGE_dae \
            CONFIG_PACKAGE_adguardhome \
            CONFIG_PACKAGE_zerotier \
            CONFIG_PACKAGE_kmod-sched \
            CONFIG_PACKAGE_kmod-sched-core \
            CONFIG_PACKAGE_kmod-sched-bpf \
            CONFIG_PACKAGE_kmod-xdp-sockets-diag \
            CONFIG_PACKAGE_kmod-tcp-bbr; do
            if grep -qx "$symbol=y" .config; then
              echo "OK: $symbol=y"
            else
              echo "FAIL: $symbol is not enabled"
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify DAE kernel config
        run: |
          cd openwrt
          echo "=== DAE kernel params check ==="
          missing=0

          echo "=== OpenWrt .config symbols ==="
          for required in \
            CONFIG_KERNEL_CGROUPS=y \
            CONFIG_KERNEL_CGROUP_BPF=y \
            CONFIG_KERNEL_XDP_SOCKETS=y \
            CONFIG_KERNEL_KPROBES=y \
            CONFIG_KERNEL_KPROBE_EVENTS=y \
            CONFIG_KERNEL_BPF_EVENTS=y \
            CONFIG_KERNEL_DEBUG_INFO=y \
            CONFIG_KERNEL_DEBUG_INFO_BTF=y; do
            if grep -qx "$required" .config; then
              echo "OK: $required"
            else
              echo "FAIL: $required missing from OpenWrt .config"
              missing=1
            fi
          done
          if grep -qx '# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set' .config; then
            echo "OK: CONFIG_KERNEL_DEBUG_INFO_REDUCED is disabled"
          else
            echo "FAIL: CONFIG_KERNEL_DEBUG_INFO_REDUCED is not disabled in OpenWrt .config"
            missing=1
          fi

          echo "=== Target kernel config symbols ==="
          KERNEL_CONFIG="$(ls target/linux/mediatek/filogic/config-* 2>/dev/null | sort -V | tail -n1)"
          for required in \
            CONFIG_NET_INGRESS=y \
            CONFIG_NET_EGRESS=y \
            CONFIG_BPF_STREAM_PARSER=y \
            CONFIG_NETKIT=y; do
            if grep -qx "$required" "$KERNEL_CONFIG"; then
              echo "OK: $required"
            else
              echo "FAIL: $required missing from $KERNEL_CONFIG"
              missing=1
            fi
          done
          if grep -qx '# CONFIG_NET_SCH_BPF is not set' "$KERNEL_CONFIG"; then
            echo "OK: CONFIG_NET_SCH_BPF is disabled"
          else
            echo "FAIL: CONFIG_NET_SCH_BPF is not pinned disabled in $KERNEL_CONFIG"
            missing=1
          fi
          exit "$missing"

      - name: Build tools & toolchain
        run: |
          cd openwrt
          set +e
          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 \
            tools/install toolchain/install > /tmp/toolchain.log 2>&1
          status=$?
          grep -E "^(make\[|ERROR|WARNING)" /tmp/toolchain.log | tail -20 || true
          exit $status

      - name: Build target + packages
        run: |
          cd openwrt
          set +e

          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 target/compile > /tmp/target-compile.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== target/compile failed: last 120 lines ==="
            tail -120 /tmp/target-compile.log
            echo "=== target/compile filtered errors ==="
            grep -E "error:|warning: .*error|Hunk|reject|FAILED|failed to build|ERROR:" /tmp/target-compile.log | \
              grep -v "^#\|//\| \* " | tail -120 || true
            echo "=== target/linux verbose rebuild for diagnostics ==="
            make -j1 V=s CCACHE_DIR=~/.ccache USE_CCACHE=1 target/linux/clean > /tmp/target-linux-clean.log 2>&1
            make -j1 V=s CCACHE_DIR=~/.ccache USE_CCACHE=1 target/linux/compile 2>&1 | tee /tmp/target-linux-debug.log
            linux_status=${PIPESTATUS[0]}
            echo "=== target/linux filtered errors ==="
            grep -E "error:|warning: .*error|Hunk|reject|FAILED|failed to build|ERROR:" /tmp/target-linux-debug.log | \
              grep -v "^#\|//\| \* " | tail -120 || true
            echo "=== target/linux verbose result: $linux_status ==="
          else
            tail -20 /tmp/target-compile.log
          fi
          [ "$status" -eq 0 ] || exit $status

          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 package/compile > /tmp/package-compile.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== package/compile failed: last 120 lines ==="
            tail -120 /tmp/package-compile.log
            echo "=== package/compile filtered errors ==="
            grep -E "error:|warning: .*error|Hunk|reject|FAILED|failed to build|ERROR:" /tmp/package-compile.log | \
              grep -v "^#\|//\| \* " | tail -120 || true

            if grep -q "package/kernel/mt76 failed to build" /tmp/package-compile.log; then
              echo "=== mt76 verbose rebuild for diagnostics ==="
              make -j1 V=s package/kernel/mt76/clean > /tmp/mt76-clean.log 2>&1
              make -j1 V=s package/kernel/mt76/compile 2>&1 | tee /tmp/mt76-debug.log
              mt76_status=${PIPESTATUS[0]}
              echo "=== mt76 filtered errors ==="
              grep -E "error:|warning: .*error|Hunk|reject|FAILED|failed to build|ERROR:" /tmp/mt76-debug.log | \
                grep -v "^#\|//\| \* " | tail -120 || true
              echo "=== mt76 verbose result: $mt76_status ==="
            fi
          else
            tail -20 /tmp/package-compile.log
          fi
          [ "$status" -eq 0 ] || exit $status

          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 package/install > /tmp/package-install.log 2>&1
          status=$?
          tail -20 /tmp/package-install.log
          [ "$status" -eq 0 ] || exit $status

          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 package/index > /tmp/package-index.log 2>&1
          status=$?
          tail -20 /tmp/package-index.log
          [ "$status" -eq 0 ] || exit $status

          echo "=== root-mediatek ===" && ls build_dir/target-aarch64_cortex-a53_musl/root-mediatek/ | wc -l || echo "MISSING"

      - name: Build firmware image
        run: |
          cd openwrt
          set +e
          make -j1 V=s CCACHE_DIR=~/.ccache USE_CCACHE=1 \
            target/install 2>&1 | tee /tmp/install.log
          status=${PIPESTATUS[0]}
          echo "=== Last 80 lines of install log ==="
          tail -80 /tmp/install.log
          echo "=== Files in bin/targets ==="
          find bin/targets -type f | sort
          exit $status

      - name: Collect artifacts and smoke test
        run: |
          mkdir -p output/firmware output/packages

          # Прошивка
          find openwrt/bin/targets -name "*sysupgrade*.bin" -o -name "sha256sums" -o -name "*.manifest" | xargs -I{} cp {} output/firmware/ 2>/dev/null || true
          find openwrt/bin/targets -name "*initramfs*.bin" | xargs -I{} cp {} output/firmware/ 2>/dev/null || true
          find openwrt/bin/targets -name "sha256sums" | xargs -I{} cp {} output/firmware/ 2>/dev/null || true
          find openwrt/bin/targets -name "*.manifest" | xargs -I{} cp {} output/firmware/ 2>/dev/null || true

          # Пакеты (для APK repo)
          rsync -av openwrt/bin/packages/ output/packages/ 2>/dev/null || true
          rsync -av openwrt/bin/targets/mediatek/filogic/packages/ output/packages/targets/ 2>/dev/null || true

          echo "=== Firmware artifacts ==="
          ls -lh output/firmware/ || echo "No firmware found"

          # Smoke test
          echo "=== Smoke test ==="
          FIRMWARE=$(ls output/firmware/*sysupgrade*.bin 2>/dev/null | head -1)
          if [ -z "$FIRMWARE" ]; then
            echo "Available files:"
            ls -lh output/firmware/ || true
            echo "FAIL: no sysupgrade firmware found"
            exit 1
          fi
          SIZE=$(stat -c%s "$FIRMWARE")
          if [ "$SIZE" -lt 10000000 ]; then
            echo "FAIL: firmware too small ($SIZE bytes)"
            exit 1
          fi
          echo "OK: firmware $(basename $FIRMWARE) ($(du -sh $FIRMWARE | cut -f1))"

          # Проверяем manifest на ключевые пакеты
          MANIFEST=$(ls output/firmware/*.manifest 2>/dev/null | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "FAIL: no firmware manifest found"
            exit 1
          fi
          missing=0
          for pkg in dae adguardhome zerotier kmod-sched kmod-sched-core kmod-sched-bpf kmod-xdp-sockets-diag kmod-tcp-bbr; do
              if grep -Eq "^${pkg} - " "$MANIFEST"; then
                echo "OK: $pkg present in manifest"
              else
                echo "FAIL: $pkg not found in manifest"
                missing=1
              fi
          done
          exit "$missing"

      - name: Generate release tag
        if: github.ref == 'refs/heads/main'
        id: tag
        run: |
          OPENWRT_REV=$(git -C openwrt rev-parse --short HEAD)
          PESA_BRANCH=$(cat mt6000-overlay/.pesa1234-branch 2>/dev/null || echo "unknown")
          TAG="build-$(date -u +%Y.%m.%d-%H%M)-${OPENWRT_REV}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "pesa_branch=$PESA_BRANCH" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Generate APK repo index for GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PAGES_DIR="gh-pages-update"
          mkdir -p "$PAGES_DIR/packages/$TAG"

          # Копируем index.json (не .apk — они пойдут в Release assets)
          find output/packages -name "index.json" | while read f; do
            REL_PATH="${f#output/packages/}"
            DEST="$PAGES_DIR/packages/$TAG/$REL_PATH"
            mkdir -p "$(dirname $DEST)"
            # Переписываем Filename URLs на Release asset URLs
            RELEASE_BASE="https://github.com/darkworon/openwrt-mt6000-releases/releases/download/$TAG"
            python3 -c "
          import json, sys, os
          data = json.load(open('$f'))
          rel_dir = os.path.dirname('$REL_PATH')
          if isinstance(data, list):
              for pkg in data:
                  if 'Filename' in pkg:
                      fname = os.path.basename(pkg['Filename'])
                      pkg['Filename'] = '$RELEASE_BASE/$rel_dir/' + fname
          json.dump(data, open('$DEST','w'))
          " 2>/dev/null || cp "$f" "$DEST"
          done

          # Ссылка latest → текущий тег
          echo "$TAG" > "$PAGES_DIR/packages/latest.txt"

          echo "Pages structure:"
          find "$PAGES_DIR" -name "*.json" | head -10

      - name: Collect APK files for Release assets
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p release-assets
          cp output/firmware/*.bin release-assets/ 2>/dev/null || true
          cp output/firmware/sha256sums release-assets/ 2>/dev/null || true
          cp output/firmware/*.manifest release-assets/ 2>/dev/null || true
          # Пакеты в тарболы по feed
          cd output/packages
          for feed_dir in */; do
            feed="${feed_dir%/}"
            tar czf "../../release-assets/packages-${feed}-${TAG}.tar.gz" "$feed_dir" 2>/dev/null || true
          done
          cd ../..
          echo "=== Release assets ==="
          ls -lh release-assets/

      - name: Generate release notes
        if: github.ref == 'refs/heads/main'
        id: notes
        run: |
          cd mt6000-overlay
          OPENWRT_SHA=$(git -C ../openwrt rev-parse --short HEAD 2>/dev/null || echo "unknown")
          PESA_BRANCH="${{ steps.tag.outputs.pesa_branch }}"
          KERNEL_COUNT=$(ls patches/kernel/*.patch 2>/dev/null | wc -l | tr -d ' ')
          MT76_COUNT=$(find patches/mt76 patches/mt76-local -maxdepth 1 -name "*.patch" 2>/dev/null | wc -l | tr -d ' ')
          RSS_COUNT=$(ls patches/kernel/999-27*.patch 2>/dev/null | wc -l | tr -d ' ')
          WED_COUNT=$(ls patches/kernel/999-99*.patch 2>/dev/null | wc -l | tr -d ' ')
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            CHANGES=$(git log ${LAST_TAG}..HEAD --oneline -- patches/ config/ files/ 2>/dev/null | head -20)
          else
            CHANGES="Initial build"
          fi
          APK_URL="https://darkworon.github.io/openwrt-mt6000-releases/packages/${{ steps.tag.outputs.tag }}/"

          NOTES="## OpenWrt MT6000 ${{ steps.tag.outputs.tag }}

          ### Патчи
          - 🔀 **RSS**: ${RSS_COUNT} патчей — 4 Rx rings, +30-40% ethernet throughput
          - 🛠️ **WED/fixes**: ${WED_COUNT} патчей — hardware WiFi offload, jumbo frames
          - 📡 **mt76**: ${MT76_COUNT} патчей — ATF, iBF beamforming, VHT 256QAM 2.4GHz
          - ⚙️ **advanced_setup**: IRQ affinity + RPS autotuning

          ### Feeds
          - packages: darkworon/packages @ next-r4.mtk
          - luci: darkworon/luci @ next-v4
          - video: openwrt/video @ main
          - dae: darkworon/openwrt-dae
          - dae outbound: \`${DAE_OUTBOUND_REPO:-https://github.com/darkworon/outbound.git}\` @ \`${DAE_OUTBOUND_REF:-stickyip-salamander}\`

          ### DAE
          - dae source: \`${DAE_SOURCE_REF:-main}\` @ \`${DAE_SOURCE_VERSION:-unknown}\`
          - outbound replace: \`${DAE_OUTBOUND_REPO:-https://github.com/darkworon/outbound.git}\` @ \`${DAE_OUTBOUND_REF:-stickyip-salamander}\`

          ### Upstream
          - openwrt/openwrt @ \`${OPENWRT_SHA}\`
          - pesa1234 tracked: \`${PESA_BRANCH}\`

          ### APK repo для этой прошивки
          \`\`\`
          ${APK_URL}
          \`\`\`

          ### Изменения
          \`\`\`
          ${CHANGES:-Нет изменений}
          \`\`\`

          ---
          **Установка:** LuCI → System → Backup/Flash Firmware  
          **SHA256:** см. sha256sums в assets"

          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish to openwrt-mt6000-releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Создаём Release в releases репо
          echo "${{ steps.notes.outputs.NOTES }}" > /tmp/release_notes.md
          gh release create "$TAG" \
            --repo darkworon/openwrt-mt6000-releases \
            --title "OpenWrt MT6000 $TAG" \
            --notes-file /tmp/release_notes.md \
            release-assets/* || echo "Release may already exist, continuing"

      - name: Update GitHub Pages (APK index)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Клонируем gh-pages ветку releases репо
          git clone --branch gh-pages --depth=1 \
            https://x-access-token:${{ secrets.RELEASES_TOKEN }}@github.com/darkworon/openwrt-mt6000-releases.git \
            gh-pages-repo

          # Копируем новые индексы
          cp -r gh-pages-update/packages/$TAG gh-pages-repo/packages/
          echo "$TAG" > gh-pages-repo/packages/latest.txt

          # Ротация: оставить последние 5 тегов в Pages
          cd gh-pages-repo/packages
          ls -d build-* 2>/dev/null | sort | head -n -5 | xargs rm -rf
          cd ../..

          # Пушим
          cd gh-pages-repo
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "pages: add APK index for $TAG" || echo "nothing to commit"
          git push

      - name: Rotate old releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # Оставить последние 5 релизов в releases репо
          gh release list --repo darkworon/openwrt-mt6000-releases --limit 100 \
            | tail -n +6 \
            | awk '{print $3}' \
            | xargs -I{} gh release delete {} \
              --repo darkworon/openwrt-mt6000-releases \
              --yes --cleanup-tag 2>/dev/null || true

      - name: Notify Telegram
        if: github.ref == 'refs/heads/main' && always()
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          STATUS="${{ job.status }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          RELEASE_URL="https://github.com/darkworon/openwrt-mt6000-releases/releases/tag/$TAG"
          MSG="${ICON} OpenWrt MT6000 | ${TAG} | ${STATUS}"
          [ "$STATUS" = "success" ] && MSG="$MSG
          📦 $RELEASE_URL"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id=84668999 \
            -d text="$MSG" > /dev/null
