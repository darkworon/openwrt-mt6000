name: Build OpenWrt for GL-MT6000

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'config/**'
      - 'files/**'
  schedule:
    - cron: '0 5 * * 5'  # пятница 05:00 UTC (после track вс+ср)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout this repo (patches + config)
        uses: actions/checkout@v4
        with:
          path: mt6000-overlay

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get autoremove -y
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl libelf-dev dwarves

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-mt6000-${{ github.sha }}
          restore-keys: |
            ccache-mt6000-

      - name: Cache OpenWrt tools/toolchain
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
          key: tools-openwrt-${{ hashFiles('openwrt/tools/**') }}
          restore-keys: |
            tools-openwrt-

      - name: Clone official OpenWrt (upstream)
        run: |
          git clone --depth=1 --branch main \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "OpenWrt upstream SHA: $(git rev-parse HEAD)"

      - name: Apply kernel patches (pesa1234 series)
        run: |
          PATCHES_DIR="mt6000-overlay/patches/kernel"
          TARGET_DIR="openwrt/target/linux/mediatek/patches-6.12"
          if [ -d "$PATCHES_DIR" ] && [ "$(ls -A $PATCHES_DIR)" ]; then
            echo "Applying kernel patches..."
            cp -v "$PATCHES_DIR"/*.patch "$TARGET_DIR/" 2>/dev/null || true
            echo "Kernel patches applied: $(ls $PATCHES_DIR/*.patch 2>/dev/null | wc -l)"
          else
            echo "No kernel patches found in $PATCHES_DIR — skipping"
          fi

      - name: Apply mt76 patches
        run: |
          PATCHES_DIR="mt6000-overlay/patches/mt76"
          TARGET_DIR="openwrt/package/kernel/mt76/patches"
          if [ -d "$PATCHES_DIR" ] && [ "$(ls -A $PATCHES_DIR)" ]; then
            echo "Applying mt76 patches..."
            mkdir -p "$TARGET_DIR"
            cp -v "$PATCHES_DIR"/*.patch "$TARGET_DIR/" 2>/dev/null || true
            echo "mt76 patches applied: $(ls $PATCHES_DIR/*.patch 2>/dev/null | wc -l)"
          else
            echo "No mt76 patches found — skipping"
          fi

      - name: Apply overlay files (advanced_setup etc.)
        run: |
          OVERLAY_DIR="mt6000-overlay/files"
          if [ -d "$OVERLAY_DIR" ] && [ "$(ls -A $OVERLAY_DIR)" ]; then
            echo "Applying overlay files..."
            cp -rv "$OVERLAY_DIR"/. openwrt/
          else
            echo "No overlay files — skipping"
          fi

      - name: Copy diffconfig
        run: |
          cp mt6000-overlay/config/mt6000.diffconfig openwrt/.config

      - name: Update feeds
        run: |
          cd openwrt
          # Standard OpenWrt feeds (no pesa1234 dependency)
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Expand config
        run: |
          cd openwrt
          make defconfig

      - name: Verify DAE kernel config
        run: |
          cd openwrt
          echo "=== DAE kernel params check ==="
          for param in CONFIG_CGROUPS CONFIG_KPROBES CONFIG_DEBUG_INFO_BTF \
                       CONFIG_BPF_STREAM_PARSER CONFIG_NET_SCH_INGRESS \
                       CONFIG_NET_CLS_BPF CONFIG_NET_CLS_ACT CONFIG_BPF_EVENTS; do
            val=$(grep "^$param" .config 2>/dev/null || echo "NOT SET")
            echo "  $param = $val"
          done

      - name: Build tools & toolchain
        run: |
          cd openwrt
          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 \
            tools/install toolchain/install 2>&1 | \
            grep -E "^(make\[|ERROR|WARNING)" | tail -20 || true

      - name: Build target + packages
        run: |
          cd openwrt
          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 \
            target/compile package/compile package/index 2>&1 | \
            grep -E "^(make\[|ERROR|WARNING)" | tail -20 || true

      - name: Build firmware image
        run: |
          cd openwrt
          make -j$(nproc) CCACHE_DIR=~/.ccache USE_CCACHE=1 \
            target/install 2>&1 | \
            grep -E "^(make\[|ERROR|WARNING)" | tail -20 || true

      - name: Collect artifacts
        run: |
          mkdir -p output
          find openwrt/bin/targets -name "*.bin" -o -name "*.img" | \
            xargs -I{} cp {} output/ 2>/dev/null || true
          echo "=== Build artifacts ==="
          ls -lh output/ || echo "No artifacts found"

      - name: Generate release tag
        if: github.ref == 'refs/heads/main'
        id: tag
        run: |
          TAG="build-$(date -u +%Y.%m.%d-%H%M)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Generate release notes
        if: github.ref == 'refs/heads/main'
        id: notes
        run: |
          cd mt6000-overlay

          # Upstream SHA
          OPENWRT_SHA=$(git -C ../openwrt rev-parse --short HEAD 2>/dev/null || echo "unknown")
          PESA_SHA=$(git ls-remote https://github.com/pesa1234/openwrt refs/heads/next-r4.8.0.rss.mtk 2>/dev/null | cut -c1-7 || echo "unknown")

          # Patch stats
          KERNEL_COUNT=$(ls patches/kernel/*.patch 2>/dev/null | wc -l | tr -d ' ')
          MT76_COUNT=$(ls patches/mt76/*.patch 2>/dev/null | wc -l | tr -d ' ')

          # What changed since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            CHANGES=$(git log ${LAST_TAG}..HEAD --oneline -- patches/ config/ files/ 2>/dev/null | head -20)
          else
            CHANGES="Initial build"
          fi

          # Patch groups summary
          RSS_COUNT=$(ls patches/kernel/999-27*.patch 2>/dev/null | wc -l | tr -d ' ')
          WED_COUNT=$(ls patches/kernel/999-99*.patch 2>/dev/null | wc -l | tr -d ' ')
          MT76_ATF=$(ls patches/mt76/200*.patch patches/mt76/251*.patch 2>/dev/null | wc -l | tr -d ' ')

          NOTES="## Что включено в этой сборке

          ### Патчи pesa1234
          - 🔀 **RSS** (Receive Side Scaling): ${RSS_COUNT} патчей — 4 Rx rings, +30-40% ethernet throughput
          - 🛠️ **WED/misc fixes**: ${WED_COUNT} патчей — hardware WiFi offload, jumbo frames, NAPI tuning
          - 📡 **mt76** (WiFi драйвер): ${MT76_COUNT} патчей — ATF, iBF beamforming, VHT 256QAM 2.4GHz
          - ⚙️ **advanced_setup**: IRQ affinity + RPS autotuning для GL-MT6000

          ### DAE (eBPF transparent proxy)
          Включены kernel параметры: CGROUPS, KPROBES, BTF, BPF_STREAM_PARSER, NET_SCH_INGRESS

          ### Upstream
          - openwrt/openwrt @ \`${OPENWRT_SHA}\`
          - pesa1234 next-r4.8.0.rss.mtk @ \`${PESA_SHA}\`

          ### Изменения с прошлого релиза
          \`\`\`
          ${CHANGES:-Нет изменений в patches/config/files}
          \`\`\`

          ---
          **Прошивать:** LuCI → System → Backup/Flash Firmware → Keep settings: по желанию"

          # Записать в файл (многострочный output)
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "OpenWrt MT6000 ${{ steps.tag.outputs.tag }}"
          body: ${{ steps.notes.outputs.NOTES }}
          files: output/*
          fail_on_unmatched_files: false
