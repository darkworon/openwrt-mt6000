name: Build OpenWrt MT6000

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout this repo (patches + config)
        uses: actions/checkout@v4
        with:
          path: meta

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get autoremove -y
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl libelf-dev dwarves

      - name: Checkout official openwrt/openwrt (main)
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: main
          fetch-depth: 1
          path: openwrt

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl/
          key: openwrt-dl-${{ hashFiles('openwrt/feeds.conf.default') }}-${{ github.sha }}
          restore-keys: |
            openwrt-dl-${{ hashFiles('openwrt/feeds.conf.default') }}-
            openwrt-dl-

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
          key: openwrt-tools-${{ hashFiles('openwrt/feeds.conf.default') }}-v1
          restore-keys: |
            openwrt-tools-

      - name: Apply patches from patches/
        run: |
          cd openwrt
          applied=0
          skipped=0
          for patch in ../meta/patches/*.patch; do
            [ -f "$patch" ] || continue
            name=$(basename "$patch")
            # Skip stub patches (size < 200 bytes)
            size=$(wc -c < "$patch")
            if [ "$size" -lt 200 ]; then
              echo "SKIP (stub): $name"
              skipped=$((skipped+1))
              continue
            fi
            if git apply --check "$patch" 2>/dev/null; then
              git apply "$patch"
              echo "OK: $name"
              applied=$((applied+1))
            else
              echo "WARN: $name did not apply cleanly, skipping"
              skipped=$((skipped+1))
            fi
          done
          echo "Applied: $applied, Skipped/stub: $skipped"

      - name: Inject DAE kernel config
        run: |
          cat meta/config/dae-kernel.config >> openwrt/target/linux/mediatek/filogic/config-6.12
          echo "=== DAE params appended ==="
          grep -E "^CONFIG_(CGROUPS|KPROBES|BPF_EVENTS|BPF_STREAM_PARSER|DEBUG_INFO_BTF|NET_SCH_INGRESS|NET_CLS_BPF|NET_CLS_ACT)" \
            meta/config/dae-kernel.config

      - name: Copy diffconfig
        run: |
          cp meta/config/mt6000.diffconfig openwrt/.config

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Expand config
        run: |
          cd openwrt
          make defconfig

      - name: Verify DAE kernel params in expanded config
        run: |
          cd openwrt
          echo "=== DAE kernel params check ==="
          for param in CONFIG_CGROUPS CONFIG_CGROUP_BPF CONFIG_KPROBES CONFIG_KPROBE_EVENTS \
                       CONFIG_BPF_EVENTS CONFIG_BPF_STREAM_PARSER CONFIG_NET_SCH_INGRESS \
                       CONFIG_NET_CLS_BPF CONFIG_NET_CLS_ACT CONFIG_DEBUG_INFO_BTF; do
            val=$(grep "^${param}[= ]" .config 2>/dev/null || echo "NOT SET")
            echo "  $param = $val"
          done

      - name: Build tools & toolchain
        run: |
          cd openwrt
          make -j$(nproc) tools/install toolchain/install V=s 2>&1 | \
            grep -E "^(make\[|ERROR|WARNING|---)" || true

      - name: Build target kernel
        run: |
          cd openwrt
          make -j$(nproc) target/compile V=s 2>&1 | \
            grep -E "^(make\[|ERROR|WARNING)" || true

      - name: Build packages
        run: |
          cd openwrt
          make -j$(nproc) package/compile package/index V=s 2>&1 | \
            grep -E "^(make\[|ERROR|WARNING)" || true

      - name: Build firmware image
        run: |
          cd openwrt
          make -j$(nproc) target/install V=s 2>&1 | \
            grep -E "^(make\[|ERROR|WARNING)" || true

      - name: Collect artifacts
        run: |
          mkdir -p output
          find openwrt/bin/targets/mediatek/filogic -name "*.bin" -o -name "*.img.gz" 2>/dev/null | \
            xargs -I{} cp {} output/ 2>/dev/null || true
          ls -lh output/ || echo "No firmware files found"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-mt6000-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
