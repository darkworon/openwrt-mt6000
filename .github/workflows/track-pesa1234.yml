name: Track pesa1234 patch updates

on:
  schedule:
    - cron: '0 4 * * 0'  # воскресенье 04:00 UTC
    - cron: '0 4 * * 3'  # среда 04:00 UTC
  workflow_dispatch:

concurrency:
  group: mt6000-track-pesa1234-${{ github.ref }}
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Find latest pesa1234 branch
        id: pesa_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Получаем список веток, находим последнюю next-r4.*.rss.mtk по version-sort.
          LATEST=$(gh api --paginate "repos/pesa1234/openwrt/branches?per_page=100" \
            --jq '.[].name' \
            | grep -E '^next-r[0-9]+\.[0-9]+\.[0-9]+\.rss\.mtk$' | \
            sort -V | tail -n1)
          if [ -z "$LATEST" ]; then
            echo "No next-r*.rss.mtk branch found"
            exit 1
          fi
          echo "Latest pesa1234 branch: $LATEST"
          echo "branch=$LATEST" >> $GITHUB_OUTPUT

      - name: Clone pesa1234/openwrt (latest branch)
        run: |
          git clone --depth=1 --branch ${{ steps.pesa_branch.outputs.branch }} \
            https://github.com/pesa1234/openwrt.git /tmp/pesa1234
          echo "Cloned branch: ${{ steps.pesa_branch.outputs.branch }}"
          echo "SHA: $(git -C /tmp/pesa1234 rev-parse HEAD)"

      - name: Check if branch is newer than tracked
        id: branch_check
        run: |
          LATEST="${{ steps.pesa_branch.outputs.branch }}"
          # Читаем что мы сейчас отслеживаем
          TRACKED=$(cat .pesa1234-branch 2>/dev/null || echo "unknown")
          echo "Tracked: $TRACKED"
          echo "Latest:  $LATEST"
          if [ "$LATEST" != "$TRACKED" ]; then
            echo "new_branch=true" >> $GITHUB_OUTPUT
            echo "new_branch_name=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "new_branch=false" >> $GITHUB_OUTPUT
          fi

      - name: Compare kernel patches
        id: kernel_diff
        run: |
          PESA_KERNEL="$(ls -d /tmp/pesa1234/target/linux/mediatek/patches-* 2>/dev/null | sort -V | tail -n1)"
          OUR_KERNEL=patches/kernel
          if [ -z "$PESA_KERNEL" ]; then
            echo "No mediatek kernel patches directory found in pesa1234/openwrt"
            exit 1
          fi

          NEW_PATCHES=""
          CHANGED_PATCHES=""
          REMOVED_PATCHES=""
          EXCLUDED_FILE="$OUR_KERNEL/EXCLUDED.md"

          for f in $PESA_KERNEL/999-*.patch; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if [ -f "$EXCLUDED_FILE" ] && grep -Fq "$name" "$EXCLUDED_FILE"; then
              continue
            fi
            if [ ! -f "$OUR_KERNEL/$name" ]; then
              NEW_PATCHES="$NEW_PATCHES\n- ➕ NEW: \`$name\`"
            elif ! diff -q "$f" "$OUR_KERNEL/$name" > /dev/null 2>&1; then
              CHANGED_PATCHES="$CHANGED_PATCHES\n- 🔄 CHANGED: \`$name\`"
            fi
          done

          for f in $OUR_KERNEL/999-*.patch; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if [ ! -f "$PESA_KERNEL/$name" ]; then
              REMOVED_PATCHES="$REMOVED_PATCHES\n- ❌ REMOVED: \`$name\`"
            fi
          done

          KERNEL_DELTA=""
          [ -n "$NEW_PATCHES" ] && KERNEL_DELTA="$KERNEL_DELTA$NEW_PATCHES"
          [ -n "$CHANGED_PATCHES" ] && KERNEL_DELTA="$KERNEL_DELTA$CHANGED_PATCHES"
          [ -n "$REMOVED_PATCHES" ] && KERNEL_DELTA="$KERNEL_DELTA$REMOVED_PATCHES"

          if [ -n "$KERNEL_DELTA" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            printf "%b" "$KERNEL_DELTA" > /tmp/kernel_delta.txt
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "(no changes)" > /tmp/kernel_delta.txt
          fi

      - name: Compare mt76 patches
        id: mt76_diff
        run: |
          PESA_MT76=/tmp/pesa1234/package/kernel/mt76/patches
          OUR_MT76=patches/mt76
          if [ ! -d "$PESA_MT76" ]; then
            echo "No mt76 patch directory found in pesa1234/openwrt"
            exit 1
          fi

          NEW_PATCHES=""
          CHANGED_PATCHES=""
          REMOVED_PATCHES=""

          # Load excluded patches list
          EXCLUDED=$(grep -o '\`[^`]*\.patch\`' patches/mt76/EXCLUDED.md 2>/dev/null | tr -d '`' || true)

          for f in $PESA_MT76/*.patch; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            # Skip intentionally excluded patches
            if echo "$EXCLUDED" | grep -q "^$name$"; then
              echo "Skipping excluded: $name"
              continue
            fi
            if [ ! -f "$OUR_MT76/$name" ]; then
              NEW_PATCHES="$NEW_PATCHES\n- ➕ NEW: \`$name\`"
            elif ! diff -q "$f" "$OUR_MT76/$name" > /dev/null 2>&1; then
              CHANGED_PATCHES="$CHANGED_PATCHES\n- 🔄 CHANGED: \`$name\`"
            fi
          done

          for f in $OUR_MT76/*.patch; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if [ ! -f "$PESA_MT76/$name" ]; then
              REMOVED_PATCHES="$REMOVED_PATCHES\n- ❌ REMOVED: \`$name\`"
            fi
          done

          MT76_DELTA=""
          [ -n "$NEW_PATCHES" ] && MT76_DELTA="$MT76_DELTA$NEW_PATCHES"
          [ -n "$CHANGED_PATCHES" ] && MT76_DELTA="$MT76_DELTA$CHANGED_PATCHES"
          [ -n "$REMOVED_PATCHES" ] && MT76_DELTA="$MT76_DELTA$REMOVED_PATCHES"

          if [ -n "$MT76_DELTA" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            printf "%b" "$MT76_DELTA" > /tmp/mt76_delta.txt
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "(no changes)" > /tmp/mt76_delta.txt
          fi

      - name: Check feeds (pesa1234/packages + pesa1234/luci)
        id: feeds_check
        run: |
          PESA_FEEDS=/tmp/pesa1234/feeds.conf.default
          OUR_FEEDS=config/feeds.conf.default
          NORMALIZED_PESA=/tmp/pesa_feeds_normalized.txt
          NORMALIZED_OUR=/tmp/our_feeds_normalized.txt

          sed \
            -e 's#https://github.com/pesa1234/packages.git#https://github.com/darkworon/openwrt-mt6000-packages.git#' \
            -e 's#https://github.com/pesa1234/luci.git#https://github.com/darkworon/openwrt-mt6000-luci.git#' \
            "$PESA_FEEDS" | grep -Ev '^[[:space:]]*(#|$)' > "$NORMALIZED_PESA"
          grep -Ev '^[[:space:]]*(#|$)' "$OUR_FEEDS" > "$NORMALIZED_OUR"

          if ! diff -q "$NORMALIZED_PESA" "$NORMALIZED_OUR" > /dev/null 2>&1; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            diff "$NORMALIZED_OUR" "$NORMALIZED_PESA" > /tmp/feeds_delta.txt || true
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "(no changes)" > /tmp/feeds_delta.txt
          fi

      - name: Compare overlay files
        id: overlay_diff
        run: |
          DELTA=""

          check_file() {
            local upstream="$1"
            local ours="$2"
            local label="$3"

            if [ ! -f "$ours" ]; then
              DELTA="$DELTA\n- ➕ MISSING LOCAL: \`$label\`"
            elif ! diff -q "$upstream" "$ours" > /dev/null 2>&1; then
              DELTA="$DELTA\n- 🔄 CHANGED: \`$label\`"
            fi
          }

          check_file \
            /tmp/pesa1234/target/linux/mediatek/filogic/base-files/etc/init.d/advanced_setup \
            files/target/linux/mediatek/filogic/base-files/etc/init.d/advanced_setup \
            advanced_setup

          check_file \
            /tmp/pesa1234/package/kernel/mt76/Makefile \
            files/package/kernel/mt76/Makefile \
            package/kernel/mt76/Makefile

          if [ -n "$DELTA" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            printf "%b" "$DELTA" > /tmp/overlay_delta.txt
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "(no changes)" > /tmp/overlay_delta.txt
          fi

      - name: Create Issue if changes detected
        if: |
          steps.branch_check.outputs.new_branch == 'true' ||
          steps.kernel_diff.outputs.has_changes == 'true' ||
          steps.mt76_diff.outputs.has_changes == 'true' ||
          steps.feeds_check.outputs.has_changes == 'true' ||
          steps.overlay_diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = '${{ steps.pesa_branch.outputs.branch }}';
            const tracked = fs.existsSync('.pesa1234-branch')
              ? fs.readFileSync('.pesa1234-branch', 'utf8').trim()
              : 'unknown';
            const newBranch = '${{ steps.branch_check.outputs.new_branch }}' === 'true';

            const kernelDelta = fs.readFileSync('/tmp/kernel_delta.txt', 'utf8');
            const mt76Delta = fs.readFileSync('/tmp/mt76_delta.txt', 'utf8');
            const feedsDelta = fs.readFileSync('/tmp/feeds_delta.txt', 'utf8');
            const overlayDelta = fs.readFileSync('/tmp/overlay_delta.txt', 'utf8');

            let body = `## pesa1234 upstream изменился\n\n`;
            body += `**Дата:** ${new Date().toISOString().split('T')[0]}\n`;
            body += `**Отслеживаемая ветка:** \`${tracked}\`\n`;
            body += `**Актуальная ветка:** \`${branch}\`\n\n`;

            if (newBranch) {
              body += `### 🆕 Новая ветка pesa1234\n`;
              body += `Вышла новая версия: \`${branch}\` (была \`${tracked}\`)\n\n`;
            }

            body += `### Kernel patches (999-* series)\n\`\`\`\n${kernelDelta}\n\`\`\`\n\n`;
            body += `### mt76 patches\n\`\`\`\n${mt76Delta}\n\`\`\`\n\n`;
            body += `### feeds.conf.default\n\`\`\`diff\n${feedsDelta}\n\`\`\`\n\n`;
            body += `### overlay / pinned files\n\`\`\`\n${overlayDelta}\n\`\`\`\n\n`;

            body += `### Как обновить\n`;
            body += `\`\`\`bash\n`;
            body += `git clone --depth=1 --branch ${branch} https://github.com/pesa1234/openwrt.git /tmp/pesa1234\n`;
            body += `KERNEL_DIR=$(ls -d /tmp/pesa1234/target/linux/mediatek/patches-* | sort -V | tail -n1)\n`;
            body += `rm -f patches/kernel/*.patch patches/mt76/*.patch\n`;
            body += `for f in "$KERNEL_DIR"/999-*.patch; do name=$(basename "$f"); grep -Fq "$name" patches/kernel/EXCLUDED.md && continue; cp "$f" patches/kernel/; done\n`;
            body += `for f in /tmp/pesa1234/package/kernel/mt76/patches/*.patch; do name=$(basename "$f"); grep -Fq "$name" patches/mt76/EXCLUDED.md && continue; cp "$f" patches/mt76/; done\n`;
            body += `sed -e 's#https://github.com/pesa1234/packages.git#https://github.com/darkworon/openwrt-mt6000-packages.git#' -e 's#https://github.com/pesa1234/luci.git#https://github.com/darkworon/openwrt-mt6000-luci.git#' /tmp/pesa1234/feeds.conf.default > config/feeds.conf.default\n`;
            body += `cp /tmp/pesa1234/target/linux/mediatek/filogic/base-files/etc/init.d/advanced_setup files/target/linux/mediatek/filogic/base-files/etc/init.d/advanced_setup\n`;
            body += `cp /tmp/pesa1234/package/kernel/mt76/Makefile files/package/kernel/mt76/Makefile\n`;
            body += `echo "${branch}" > .pesa1234-branch\n`;
            body += `git add patches/ files/ config/ .pesa1234-branch && git commit -m "chore: sync patches from pesa1234 ${branch}"\n`;
            body += `\`\`\`\n`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[pesa1234 tracker] Обновление: ${branch}`,
              body: body,
              labels: ['upstream-sync']
            });
